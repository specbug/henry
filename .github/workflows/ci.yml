name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Ubuntu runners have a Docker engine; the engine tests run there.
      HENRY_ENGINE_TESTS: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Caddy, for Hinge's tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -fsSL -o caddy.tgz https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz
          tar xzf caddy.tgz caddy && sudo mv caddy /usr/local/bin/caddy
          echo "HENRY_CADDY=/usr/local/bin/caddy" >> "$GITHUB_ENV"
      - name: restic, for Ark's tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -fsSL https://github.com/restic/restic/releases/download/v0.18.1/restic_0.18.1_linux_amd64.bz2 | bunzip2 > restic
          chmod +x restic && sudo mv restic /usr/local/bin/restic
          echo "HENRY_RESTIC=/usr/local/bin/restic" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: the example lease passes its own check
        run: cargo run -q -p henry -- check examples/lease.toml
