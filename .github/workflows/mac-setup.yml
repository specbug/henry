name: mac-setup

# scripts/setup.sh for real on a Mac: Homebrew, launchd and the Keychain,
# with Cloudflare, GitHub, R2 and Podman faked. Run twice, the second time
# with Henry's agents up, as a re-run on the hosting Mac is. It is the
# slowest job, so only for changes to what it tests.
on:
  push:
    branches: [main]
    paths:
      - scripts/**
      - crates/henry/src/launchd.rs
      - .github/workflows/mac-setup.yml
  pull_request:
    paths:
      - scripts/**
      - crates/henry/src/launchd.rs
      - .github/workflows/mac-setup.yml

concurrency:
  group: mac-setup-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mac-setup:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p henry
      - run: scripts/test-setup.sh target/debug/henry
