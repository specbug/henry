# Henry Configuration
# See https://github.com/rishitv/henry for documentation
#
# Secret references use 1Password CLI format:
#   op://vault/item/field
#

[daemon]
# Data directory for runtime files
data_dir = "~/.henry"
# PID file location
pid_file = "~/.henry/henry.pid"
# Lock port for single-instance detection
lock_port = 18790

[network]
# Address to bind services to ("0.0.0.0" for all interfaces)
bind_address = "0.0.0.0"
# Optional: your static LAN IP for documentation/healthchecks
# static_ip = "192.168.1.100"

[network.tailscale]
enabled = false
hostname = "henry"
serve_https = true

[telegram]
enabled = false
# 1Password reference for bot token
token_ref = "op://Private/Henry Telegram Bot/credential"
# Allowed Telegram user IDs (get yours from @userinfobot)
allowed_users = []
# Alternatively, allow by username
allowed_usernames = []

[http]
enabled = true
port = 18791
# Optional: require API token for authentication
# token_ref = "op://Private/Henry API/token"

[containers]
enabled = true
# Use Podman (recommended) instead of Docker
use_podman = true
# Optional: explicit socket path (auto-detected if not set)
# socket_path = "/run/user/501/podman/podman.sock"
# Allowlist of containers Henry can manage (empty = all)
allowed_containers = []

[media]
enabled = false
# Media library paths to manage
library_paths = []
# Jellyfin container name
jellyfin_container = "jellyfin"
# Jellyfin server URL
jellyfin_url = "http://localhost:8096"
# 1Password reference for Jellyfin API key
# jellyfin_api_key_ref = "op://Private/Jellyfin/api-key"
# Enable hardware transcoding (VideoToolbox on macOS)
hw_transcode = true

[claude]
enabled = false
# 1Password reference for Anthropic API key
api_key_ref = "op://Private/Anthropic API/credential"
# Maximum concurrent Claude Code sessions
max_sessions = 4
# Workspace directory for Claude sessions
workspace_dir = "~/claude-workspaces"

[maint]
enabled = true
# Enable automated backups
backup_enabled = true
# Backup schedule (cron format: sec min hour day month day-of-week)
backup_cron = "0 0 3 * * *"   # 3 AM daily
# Backup directory
backup_dir = "~/.henry/backups"
# Maximum number of backups to retain
max_backups = 7
# Enable log rotation
log_rotation_enabled = true
# Log rotation schedule
log_rotation_cron = "0 0 0 * * *"  # Midnight daily
# Log directory for rotation
log_dir = "~/.henry/logs"
# Maximum rotated log files to keep
max_log_files = 10
# Maximum log file size before rotation (bytes)
max_log_size = 10485760  # 10 MB
# Enable update checking
update_check_enabled = true
# Update check schedule
update_check_cron = "0 0 12 * * *"  # Noon daily
# GitHub repository for update checks
github_repo = "specbug/henry"

[logging]
# Log level: trace, debug, info, warn, error
level = "info"
# Log directory
dir = "~/.henry/logs"
# Enable JSON logging for machine parsing
json = false

[reactive]
enabled = false
# Check interval in seconds
check_interval_secs = 30
# CPU usage threshold (percentage)
cpu_threshold = 90.0
# Memory usage threshold (percentage)
memory_threshold = 85.0
# Disk usage threshold (percentage)
disk_threshold = 90.0
# Require approval for destructive actions
require_approval = true

[agent]
enabled = false
# Maximum steps per task
max_steps_per_task = 10
# Default token budget per task
default_token_budget = 50000
# Auto-start task processing
auto_start = true

[proxy]
enabled = false
# Caddy container image
caddy_image = "caddy:2-alpine"
# Caddy container name
caddy_container = "henry-caddy"
# HTTP port to expose
http_port = 80
# HTTPS port to expose
https_port = 443
# Directory for Caddy configuration
config_dir = "~/.henry/caddy"
# ACME email for Let's Encrypt certificates
# acme_email = "you@example.com"
# Docker network for the proxy
network_name = "henry-apps"

[apps]
enabled = false
# Directory for app workspaces
workspace_dir = "~/.henry/apps"
# Docker network for apps
network_name = "henry-apps"
# Auto-restart apps on failure
auto_restart = true
# Health check interval in seconds
health_check_interval_secs = 30
# Default container port for apps
default_port = 8080
# Maximum concurrent builds
max_concurrent_builds = 2
# Build timeout in seconds
build_timeout_secs = 600

[tunnel]
enabled = false
# 1Password reference for Cloudflare tunnel token
tunnel_token_ref = "op://Private/Cloudflare Tunnel/token"
# 1Password reference for Cloudflare API token
api_token_ref = "op://Private/Cloudflare/api-token"
# Cloudflare zone ID
zone_id = ""
# Tunnel name/ID
tunnel_name = "henry-tunnel"
# cloudflared container name
container_name = "henry-cloudflared"
# cloudflared container image
container_image = "cloudflare/cloudflared:latest"
# Docker network
network_name = "henry-apps"
