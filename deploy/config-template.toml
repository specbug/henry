# Henry Configuration Template for Mac Mini M4
# Copy to ~/.henry/config.toml and customize
#
# Secrets use 1Password CLI format: op://vault/item/field
# Store secrets with: op item create --category=login --title="Name" credential=VALUE

[daemon]
data_dir = "~/.henry"
pid_file = "~/.henry/henry.pid"
lock_port = 18790

[network]
bind_address = "0.0.0.0"
# Your Mac Mini's static IP (optional, for documentation)
# static_ip = "192.168.1.100"

# Tailscale integration (configure after running tailscale-setup.sh)
[network.tailscale]
enabled = false
hostname = "henry"
serve_https = true

# ═══════════════════════════════════════════════════════════════════
# INTERFACES - How you interact with Henry
# ═══════════════════════════════════════════════════════════════════

[telegram]
enabled = false
# Create bot via @BotFather, store token in 1Password
token_ref = "op://Private/Henry Telegram Bot/credential"
# Get your user ID from @userinfobot
allowed_users = []
# Or use usernames (without @)
allowed_usernames = []

[http]
enabled = true
port = 18791
# Optional: Require Bearer token for API access
# token_ref = "op://Private/Henry API/token"

[logging]
level = "info"
dir = "~/.henry/logs"
json = false

# ═══════════════════════════════════════════════════════════════════
# MODULES - Features you want to enable
# ═══════════════════════════════════════════════════════════════════

# --- Container Management ---
[containers]
enabled = true
use_podman = true
# Auto-detected, but can specify explicitly:
# socket_path = "/Users/YOU/.colima/default/docker.sock"
# Restrict which containers Henry can manage (empty = all)
allowed_containers = []

# --- Media Server (Jellyfin) ---
[media]
enabled = false
library_paths = [
    # "/Volumes/Media/Movies",
    # "/Volumes/Media/TV"
]
jellyfin_container = "jellyfin"
jellyfin_url = "http://localhost:8096"
# jellyfin_api_key_ref = "op://Private/Jellyfin/api-key"
hw_transcode = true  # VideoToolbox on M4

# --- Claude AI Integration ---
[claude]
enabled = false
api_key_ref = "op://Private/Anthropic API/credential"
max_sessions = 4
workspace_dir = "~/claude-workspaces"

# --- Automated Maintenance ---
[maint]
enabled = true
backup_enabled = true
backup_cron = "0 0 3 * * *"           # 3 AM daily
backup_dir = "~/.henry/backups"
max_backups = 7
log_rotation_enabled = true
log_rotation_cron = "0 0 0 * * *"     # Midnight daily
log_dir = "~/.henry/logs"
max_log_files = 10
max_log_size = 10485760               # 10 MB
update_check_enabled = true
update_check_cron = "0 0 12 * * *"    # Noon daily
github_repo = "specbug/henry"

# --- Reactive Monitoring (Auto-healing) ---
[reactive]
enabled = false
check_interval_secs = 10
max_actions_per_hour = 20
max_concurrent_actions = 3
quiet_hours_start = 2                 # 2 AM
quiet_hours_end = 6                   # 6 AM

[reactive.thresholds]
disk_warning_percent = 80.0
disk_critical_percent = 95.0
memory_warning_percent = 85.0
memory_critical_percent = 95.0
cpu_warning_percent = 90.0
cpu_alert_duration_secs = 300

# --- Agent Task Execution (AI-powered tasks) ---
[agent]
enabled = false
max_concurrent_tasks = 1
max_steps_per_task = 10
max_tokens_per_task = 50000
planning_model = "claude-sonnet-4-20250514"

[agent.safety]
command_allowlist = ["ls", "cat", "git", "npm", "cargo", "brew"]
command_blocklist = ["rm -rf", "sudo", "chmod 777"]
