[workspace]
resolver = "2"
members = [
    "crates/henry-core",
    "crates/henry-config",
    "crates/henry-lock",
    "crates/henry-secrets",
    "crates/henry-state",
    "crates/henry-tui",
    "crates/henry-health",
    "crates/henry-telegram",
    "crates/henry-http",
    "crates/henry-server",
    "crates/henry-media",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Rishit Vora"]
license = "MIT"
repository = "https://github.com/rishitv/henry"

[workspace.dependencies]
# Core
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }

# Security
subtle = "2"

# Telegram
teloxide = { version = "0.13", features = ["macros"] }

# HTTP
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
http = "1"

# Containers
bollard = "0.18"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# UI
ratatui = "0.29"
crossterm = "0.28"

# Async utilities
tokio-util = "0.7"
futures = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# File watching
notify = "7"

# Workspace crates
henry-core = { path = "crates/henry-core" }
henry-config = { path = "crates/henry-config" }
henry-lock = { path = "crates/henry-lock" }
henry-secrets = { path = "crates/henry-secrets" }
henry-state = { path = "crates/henry-state" }
henry-tui = { path = "crates/henry-tui" }
henry-health = { path = "crates/henry-health" }
henry-telegram = { path = "crates/henry-telegram" }
henry-http = { path = "crates/henry-http" }
henry-server = { path = "crates/henry-server" }
henry-media = { path = "crates/henry-media" }

[profile.release]
lto = true
codegen-units = 1
strip = true
